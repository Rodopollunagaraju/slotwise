events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with Request-ID and Upstream Latency
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                    'rid="$request_id"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zones (Leaky Bucket)
    # General API limit: 30 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
    # Booking creation limit: 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=booking_create_limit:10m rate=10r/s;

    # Micro-Cache for High-Throughput Public Endpoints (Services & Availability lookup)
    proxy_cache_path /var/cache/nginx/microcache levels=1:2 keys_zone=microcache:10m max_size=100m inactive=1m use_temp_path=off;

    # Upstream API Replicas Load Balancer (Round Robin with Keepalive)
    upstream api_cluster {
        least_conn; # Route to replica with least active connections
        server api:4000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost *.slotwise.com slotwise.local;

        # Client body size for file uploads / requests
        client_max_body_size 10M;

        # Generate a unique Request ID for distributed tracing if not provided by client
        set $req_id $http_x_request_id;
        if ($req_id = "") {
            set $req_id $request_id;
        }

        # Add Request ID header to client response
        add_header X-Request-ID $req_id always;

        # Health check endpoint (bypasses rate limit and cache)
        location /health {
            proxy_pass http://api_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            access_log off;
        }

        # Booking creation endpoint (Strict Rate Limiting)
        location /api/v1/bookings {
            limit_req zone=booking_create_limit burst=20 nodelay;

            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # Public Services List: Micro-cache for 5 seconds to reduce DB load
        location ~ ^/api/v1/services$ {
            # Only cache GET requests
            proxy_cache microcache;
            proxy_cache_methods GET;
            proxy_cache_valid 200 5s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_key "$scheme$host$request_uri";

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Request-ID $req_id always;

            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
        }

        # General API Gateway routing
        location / {
            limit_req zone=api_general_limit burst=50 nodelay;

            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }
    }
}
